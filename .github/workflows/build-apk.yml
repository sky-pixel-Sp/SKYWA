name: SKYWA CI — tests and Android debug APK
on:
  push:
    branches: [main, master, "ci/**", "feat/standalone-android-runtime"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skywa-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-build:
    name: Verify source and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install engine dependencies
        working-directory: packages/whatsapp-engine
        run: npm install --no-audit --no-fund
      - name: Install backend dependencies
        working-directory: apps/server
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find apps packages -type f -name '*.js' -not -path '*/node_modules/*' -print0)
      - name: Run engine unit tests
        run: node --test tests/unit/*.test.mjs
      - uses: android-actions/setup-android@v4
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;27.3.13750724"
      - name: Prepare embedded Node.js runtime and production bot bundle
        run: bash scripts/prepare-standalone-android.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        id: apk_build
        run: gradle --no-daemon assembleDebug
      - name: Verify APK artifact and metadata
        id: apk_verify
        run: bash scripts/verify-apk.sh
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SKYWA-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Summarize CI
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.apk_build.outcome }}
          VERIFY_OUTCOME: ${{ steps.apk_verify.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## SKYWA CI"
            echo "- Job: ${JOB_STATUS:-unknown}"
            echo "- APK build: ${BUILD_OUTCOME:-not reached}"
            echo "- APK verification: ${VERIFY_OUTCOME:-not reached}"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-repository-download:
    name: Publish APK in repository download branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/standalone-android-runtime'
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: SKYWA-debug-apk-${{ github.sha }}
          path: release
      - name: Prepare stable filename
        run: cp release/app-debug.apk SKYWA-standalone-arm64.apk
      - name: Publish APK on a dedicated download branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-downloads
          git add SKYWA-standalone-arm64.apk
          git commit -m "Publish SKYWA standalone ARM64 APK"
          git push --force origin HEAD:refs/heads/apk-downloads
